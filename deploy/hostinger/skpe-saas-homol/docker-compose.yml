services:
  sparks-homol:
    image: ${IMAGE_NAME}
    container_name: sparks-homol
    restart: unless-stopped
    networks:
      - sparks-homol-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.sparks-homol.rule=${SPARKS_ROUTER_RULE}
      - traefik.http.routers.sparks-homol.entrypoints=websecure
      - traefik.http.routers.sparks-homol.tls.certresolver=letsencrypt
      - traefik.http.routers.sparks-homol.tls.domains[0].main=sparks.sparkoop.com
      - traefik.http.services.sparks-homol.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sparks-homol-net:
    name: sparks-homol-net
    driver: bridge
